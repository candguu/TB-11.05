<div class="dash-sub-page" id="dash-markets2" style="display:none">
    <style>
        #dash-markets2 .tbl-head, #dash-markets2 .tbl-row {
            display: grid;
            grid-template-columns: 40px 50px 2fr 1.2fr 100px 100px 1fr 1.2fr 100px !important;
            gap: 10px;
            padding: 12px 20px;
            align-items: center;
        }
    </style>
    <div style="max-width:1400px;margin:0 auto;padding:0 20px">
        <!-- Hero Section -->
        <div class="mkt-hero" style="border-radius:12px;margin-bottom:24px;">
            <div class="mkt-hero-bg" style="border-radius:12px;"></div>
            <div class="mkt-hero-inner">
                <div class="mkt-hero-content">
                    <div class="mkt-badge">
                        <span class="mkt-badge-dot"></span>
                        Canlı Piyasa
                    </div>
                    <h1 class="mkt-title">Kripto Piyasaları</h1>
                    <div style="font-size:12px;color:var(--t3);margin-top:8px">
                        Son güncelleme: <span id="last-update-time">--:--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stat Cards Row - Top -->
        <div style="display:flex;gap:16px;margin-bottom:24px;justify-content:center;">
            <div class="stat-card-large">
                <span class="stat-label-large">Toplam Piyasa Değeri</span>
                <span class="stat-value-large" id="ms-total-cap">$3.42T</span>
                <span class="stat-change-large" id="ms-total-cap-chg" style="color:var(--green)">+2.14%</span>
            </div>
            <div class="stat-card-large">
                <span class="stat-label-large">24s Hacim</span>
                <span class="stat-value-large" id="ms-total-vol">$187B</span>
                <span class="stat-change-large" id="ms-total-vol-chg" style="color:var(--green)">+8.4%</span>
            </div>
            <div class="stat-card-large">
                <span class="stat-label-large">BTC Dominansı</span>
                <span class="stat-value-large" id="ms-btc-dom">54.3%</span>
                <span class="stat-change-large" id="ms-btc-dom-chg" style="color:var(--red)">−0.6%</span>
            </div>
            <div class="stat-card-large">
                <span class="stat-label-large">Fear & Greed</span>
                <span class="stat-value-large" id="ms-fng" style="color:var(--amber)">74</span>
                <span class="stat-change-large" id="ms-fng-lbl" style="color:var(--amber)">Açgözlü</span>
            </div>
        </div>

        <!-- Tabs and Search Row -->
        <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:12px">
            <!-- Left: Tabs -->
            <div style="display:flex;gap:12px;">
                <button class="mkt-tab active" data-tab="all" onclick="switchMarketTab('all')" style="display:inline-flex;align-items:center;gap:6px;">
                    Tüm Coinler
                </button>
                <button class="mkt-tab" data-tab="gainers" onclick="switchMarketTab('gainers')" style="display:inline-flex;align-items:center;gap:6px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--green)">
                        <polyline points="18 15 12 9 6 15" />
                    </svg>
                    Yükselenler
                </button>
                <button class="mkt-tab" data-tab="losers" onclick="switchMarketTab('losers')" style="display:inline-flex;align-items:center;gap:6px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--red)">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                    Düşenler
                </button>
                <button class="mkt-tab" data-tab="watchlist" onclick="switchMarketTab('watchlist')" style="display:inline-flex;align-items:center;gap:6px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--amber)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"></polygon></svg>
                    Favoriler (<span id="watchlist-count">0</span>)
                </button>
            </div>

            <!-- Right: Search -->
            <div class="mkt-search-box" style="min-width:320px;max-width:320px;">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="market-search" placeholder="Kripto ara..." class="mkt-search-input"
                    autocomplete="off" style="border-radius:12px;">
            </div>
        </div>

        <!-- Table -->
        <div class="tbl-wrap" style="max-width:100%; padding:0;">
            <div class="mkt-tbl" style="background:transparent; padding:0; border:none;">
                <div class="tbl-head">
                    <div class="th"></div>
                    <div class="th">#</div>
                    <div class="th">Coin</div>
                    <div class="th sortable" style="text-align:right" data-sort="price">Fiyat</div>
                    <div class="th sortable" style="text-align:right" data-sort="change24h">24s %</div>
                    <div class="th sortable" style="text-align:right" data-sort="change7d">7g %</div>
                    <div class="th sortable" style="text-align:right" data-sort="volume">Hacim</div>
                    <div class="th sortable" style="text-align:right" data-sort="marketcap">Piyasa Değeri</div>
                    <div class="th" style="text-align:center">İşlem</div>
                </div>
                <div id="coin-list2" style="border-radius:0 0 16px 16px;overflow:hidden"></div>
            </div>
        </div>

        <!-- Pagination -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:20px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px">
            <div style="font-size:13px;color:var(--t2)">
                Gösterilen: <span id="showing-range">1-50</span> / <span id="total-coins">100</span>
            </div>
            <div style="display:flex;gap:8px">
                <button id="first-page" onclick="goToPage(1)" 
                    style="padding:8px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:var(--t2);font-size:12px;cursor:pointer;transition:all 0.2s"
                    onmouseover="this.style.background='rgba(255,255,255,0.08)'"
                    onmouseout="this.style.background='rgba(255,255,255,0.04)'">
                    ⏮ İlk
                </button>
                <button id="prev-page" onclick="changePage(-1)" 
                    style="padding:8px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:var(--t2);font-size:12px;cursor:pointer;transition:all 0.2s"
                    onmouseover="this.style.background='rgba(255,255,255,0.08)'"
                    onmouseout="this.style.background='rgba(255,255,255,0.04)'">
                    ← Önceki
                </button>
                <div style="display:flex;gap:4px" id="page-numbers"></div>
                <button id="next-page" onclick="changePage(1)"
                    style="padding:8px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:var(--t2);font-size:12px;cursor:pointer;transition:all 0.2s"
                    onmouseover="this.style.background='rgba(255,255,255,0.08)'"
                    onmouseout="this.style.background='rgba(255,255,255,0.04)'">
                    Sonraki →
                </button>
                <button id="last-page" onclick="goToLastPage()" 
                    style="padding:8px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:var(--t2);font-size:12px;cursor:pointer;transition:all 0.2s"
                    onmouseover="this.style.background='rgba(255,255,255,0.08)'"
                    onmouseout="this.style.background='rgba(255,255,255,0.04)'">
                    Son ⏭
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ─── BOT PANELİ ─── -->
